name: Deploy to VPS

on:
  push:
    branches: 
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Deploy to VPS
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: 22
        script: |
          echo "=== Starting Deployment ==="
          
          cd /home/bnsp5/muk/muk-system-integrator

          echo "Pulling latest code..."
          git pull origin main

          echo "Stopping old container..."
          docker stop my-app || true
          docker rm my-app || true

          echo "Removing old image..."
          docker rmi my-web-app || true

          echo "Building new image..."
          docker build --no-cache -t my-web-app .

          echo "Starting new container..."
          docker run -d -p 80:80 --name my-app my-web-app

          echo "=== Deployment Complete ==="
          docker ps | grep my-app
          echo "Showing first 20 lines of deployed file:"
          docker exec my-app cat /usr/share/nginx/html/index.html | head -20